# DHS Orchestrator log rotation
# Runs via: logrotate /home/kumar1/orchestrator/backend/logrotate.conf
# Add to crontab: 0 0 * * * /usr/sbin/logrotate /home/kumar1/orchestrator/backend/logrotate.conf

/tmp/backend.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    size 10M
    copytruncate
}

/tmp/celery.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    size 20M
    copytruncate
}
